const scenes={ready:{status:'Готово к приёмке',tone:'green',stage:4,badge:'Ваше решение',title:'Результат готов',text:'Проекты разделены, прогресс задач добавлен. Посмотрите результат — затем примите его или оставьте замечания.',needs:'Что проверить',checks:['Переключение проектов и список задач','Понятны ли этапы и доступные действия'],note:'Проверки пройдены · 51 тест',primary:'Посмотреть результат',primaryAction:'preview',secondary:'Принять',secondaryAction:'accept'},running:{status:'Выполняется',tone:'blue',stage:1,badge:'Агент работает',title:'Обновляет карточку задачи',text:'Агент добавляет понятные состояния и компактные индикаторы этапов. Последнее действие — сохранение компонента карточки.',needs:'Следующий шаг',checks:['Контроллер проверит код и сборку','От вас сейчас ничего не требуется'],note:'Реализация · начато 4 мин назад',primary:'Посмотреть процесс',primaryAction:'worker',secondary:'Пауза',secondaryAction:'pause'},blocked:{status:'Техническая остановка',tone:'amber',stage:3,badge:'Требуется исправление',title:'Конфликт в критериях ревью',text:'Проверки прошли. Ревью использовало старое ограничение «только план», хотя реализация была утверждена. Попытки закончились.',needs:'Что дальше',checks:['Контроллер должен исправить контекст ревью','Вопроса к вам нет. Повторный запуск сам по себе не устранит причину'],note:'Проверки пройдены · остановлено на ревью',primary:'Причина остановки',primaryAction:'reason',secondary:'Посмотреть результат',secondaryAction:'preview'},question:{status:'Нужен ответ',tone:'amber',stage:0,badge:'Один вопрос',title:'Как отображать завершённые задачи?',text:'Предлагаем скрывать принятые задачи по умолчанию и оставлять их доступными через фильтр «Все задачи».',needs:'Ваш ответ',checks:['Рекомендация: скрывать по умолчанию','После ответа агент продолжит планирование'],note:'Планирование · ожидается ответ',primary:'Подходит',primaryAction:'answer',secondary:'Другой вариант',secondaryAction:'reply'},limit:{status:'Ожидает сброса лимита',tone:'amber',stage:1,badge:'Пауза по лимиту',title:'Работа сохранена',text:'Защитная пауза перед новым этапом. Продолжение произойдёт автоматически после сброса лимита и свежей проверки расхода.',needs:'Что дальше',checks:['Следующая проверка лимита — в 03:27','От вас ничего не требуется, изменения сохранены'],note:'Пауза · использовано 90% лимита',primary:'Сохранённые изменения',primaryAction:'diff',secondary:'История',secondaryAction:'history'}};
scenes.backlog={status:'В бэклоге',tone:'',stage:0,badge:'Ещё не запущена',title:'Задача сохранена',text:'Она видна в общем списке, но не выполняется автоматически. Перед запуском проверим зависимости и план.',needs:'Что дальше',checks:['Выберите место задачи в очереди','Зависимости не пропускаются автоматически'],note:'Бэклог · без активного процесса',primary:'Добавить в очередь',primaryAction:'queue-demo',secondary:'Обсудить','secondaryAction':'reply'};
const tasks=[{id:'003',title:'Проекты и прогресс задач',selected:true},{id:'004',title:'Минималистичный интерфейс',status:'План готов',tone:'amber',stage:0},{id:'005',title:'Просмотр работы агента',status:'В бэклоге',tone:'',stage:-1},{id:'006',title:'Очередь и зависимости',status:'Ждёт задачу #005',tone:'',stage:-1}];
const query=new URLSearchParams(location.search);let variant=['focus','queue','feed'].includes(query.get('variant'))?query.get('variant'):'focus',scene='ready',selected='003',filter='all',project='tw-web';
const descriptions={focus:'Список слева, решение справа. Спокойный баланс информации и пространства.',queue:'Плотная очередь и компактная карточка. Для нескольких задач одновременно.',feed:'Одна лента без бокового меню. Максимум внимания текущему решению.'};
function stages(stage,glyph=false){return `<div class="progress" aria-label="Этапы задачи">${stageNames.map((name,i)=>`<button class="stage ${i<stage?'done':i===stage?'current':'future'} ${glyph?'glyph':''}" data-action="stage:${i}" data-tip="${name}${i<stage?' · завершено':i===stage?' · сейчас':''}" aria-label="${name}${i===stage?' — текущий этап':''}" ${i===stage?'aria-current="step"':''}>${glyph?icon(stageIcons[i]):'<span class="dot"></span>'}</button>`).join('')}</div>`}
function btn(text,action,style='',ico=''){return `<button class="btn ${style}" data-action="${action}">${ico?icon(ico):''}${text}</button>`}
function sidebar(){return `<aside class="sidebar"><div class="wordmark"><div class="symbol">${icon('logo')}</div><span>tw</span></div><p class="caption">Рабочее пространство</p><button class="project ${project==='tw-web'?'selected':''}" data-project="tw-web" title="tw-web">${icon('folder')}<span>tw-web</span><span class="count">4</span></button><button class="project ${project==='store'?'selected':''}" data-project="store" title="Магазин">${icon('folder')}<span>Магазин</span><span class="count">2</span></button><button class="project add-project" data-action="connect" title="Подключить проект">${icon('plus')}<span>Добавить проект</span></button><div class="sidebar-foot">Всё сохранено локально<div class="profile"><span class="avatar">ВЫ</span>Ваше пространство</div></div></aside>`}
function taskList(){const list=tasks.filter(t=>filter==='all'||(filter==='attention'?t.id==='003'||t.id==='004':t.id==='005'||t.id==='006'));return `<section class="task-list" aria-label="Задачи"><div class="list-head"><span>Задачи проекта</span><span>${list.length}</span></div>${list.map(t=>{const s=t.id==='003'?scenes[scene]:t;return `<button class="task-row ${t.id===selected?'selected':''}" data-task="${t.id}" aria-label="Открыть задачу ${t.id}: ${t.title}"><div class="task-first"><span class="task-id">#${t.id}</span><span class="task-title">${t.title}</span></div><div class="task-second"><span class="status ${s.tone||''}">${s.status}</span><span aria-label="Текущий этап" class="progress">${stageNames.map((_,i)=>`<span class="stage ${i<s.stage?'done':i===s.stage?'current':'future'}"><span class="dot"></span></span>`).join('')}</span></div></button>`}).join('')}<div class="list-bottom"><span>Все ${list.length} задачи на экране</span><span><button disabled aria-label="Предыдущая страница">‹</button> 1 / 1 <button disabled aria-label="Следующая страница">›</button></span></div></section>`}
function detail(){const s=scenes[scene];const title=tasks.find(t=>t.id===selected)?.title||tasks[0].title;return `<section class="detail" aria-label="Карточка задачи"><div class="detail-top"><span class="task-id">TASK-${selected}</span><span class="tag">${s.badge}</span></div><div><h2>${title}</h2><p class="subtitle">${project==='tw-web'?'tw-web':'Магазин'} <span style="margin:0 5px;color:#c3cbbb">/</span> Изолированная рабочая копия</p></div><div class="detail-stage">${stages(s.stage,variant==='queue')}<span class="stage-note">${stageNames[s.stage]}</span></div><div class="detail-body"><div class="decision"><h3 class="decision-heading">${icon(scene==='ready'?'check':scene==='running'?'code':scene==='question'?'chat':scene==='limit'?'clock':'info')}${s.title}</h3><p>${s.text}</p></div><div style="${variant==='feed'?'':'margin-top:16px'}"><p class="eyebrow">${s.needs}</p><ul class="check-list">${s.checks.map(text=>`<li>${icon('check')}<span>${text}</span></li>`).join('')}</ul></div></div><div class="actions">${btn(s.primary,s.primaryAction,'primary large',s.primaryAction==='preview'?'eye':s.primaryAction==='worker'?'code':'arrow')}${btn(s.secondary,s.secondaryAction,'large')}${scene==='ready'?btn('Замечания','reply','ghost'):''}</div><div class="details-bottom"><div class="tools" aria-label="Документы и подробности">${[['chat','Исходная задача'],['plan','План'],['code','Изменения'],['test','Проверки'],['review','Ревью'],['history','История']].map(([ico,name])=>`<button class="tool" aria-label="${name}" data-tip="${name}" data-action="${ico==='chat'?'request':ico==='code'?'diff':ico==='test'?'checks':ico}">${icon(ico)}</button>`).join('')}</div><span class="tiny">${s.note}</span></div></section>`}
function render(){document.getElementById('app').className=`app ${variant}`;document.getElementById('description').textContent=descriptions[variant];document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===variant);b.setAttribute('aria-pressed',String(b.dataset.variant===variant))});const list=taskList(),card=detail();document.getElementById('app').innerHTML=`${sidebar()}<main class="main"><header class="topbar"><div class="crumb">${variant==='feed'?'<span style="font-weight:650;color:#303c2b;font-size:20px;margin-right:20px">tw</span>':''}<strong>${project==='tw-web'?'tw-web':'Магазин'}</strong><button class="btn ghost" data-action="projects" style="padding:3px" aria-label="Выбрать проект">${icon('down')}</button><span>/</span><span>Задачи</span></div><div class="top-right"><button class="worker" data-action="worker"><span class="alive"></span>${scene==='running'?'Агент работает':'Worker на связи'}${icon('chevron')}</button>${btn('Новая задача','create','primary','plus')}</div></header><div class="toolbar"><h1>${variant==='feed'?'На сегодня':variant==='queue'?'Очередь задач':'Задачи'}</h1><span class="number">4</span><button class="filter ${filter==='all'?'active':''}" data-filter="all">Все</button><button class="filter ${filter==='attention'?'active':''}" data-filter="attention">Нужно вам</button><button class="filter ${filter==='backlog'?'active':''}" data-filter="backlog">Бэклог</button><label class="search">${icon('search')}<input id="task-search" aria-label="Поиск задач" placeholder="Найти задачу…"></label></div><div class="workspace">${variant==='feed'?card+list:list+card}</div><footer class="help-footer"><span>${variant==='focus'?'A · Фокус — контекст и решение рядом':variant==='queue'?'B · Очередь — плотнее список, больше задач в поле зрения':'C · Лента решений — минимум постоянных элементов'}</span><span>Наводите на этапы и иконки · подробности открываются по запросу</span></footer></main>`}
const modal=document.getElementById('modal'),modalTitle=document.getElementById('modal-title'),modalContent=document.getElementById('modal-content');document.getElementById('close-modal').innerHTML=icon('close');
function show(title,html){modalTitle.textContent=title;modalContent.innerHTML=html+'<div class="demo-note">Демонстрационный макет. Реальные задачи и процессы не изменяются.</div>';if(!modal.open)modal.showModal()}
const documents={request:['Исходный текст задачи','<p>Добавить проекты с задачами внутри каждого. Показывать понятные этапы, статусы и следующие действия. Сделать интерфейс минималистичным, без постоянных полотен технического текста.</p><p>Выбран вариант A, цвета из B. В панели worker нужна команда наблюдения за агентом. Исходный текст задачи должен быть доступен по запросу.</p>'],plan:['Спецификация и план','<h4>Что делаем</h4><p>Разделяем задачи по проектам. В каждой задаче показываем её этап, понятный статус и следующее действие.</p><h4>План</h4><p>1. Выбор проектов и изоляция данных.<br>2. Компактные этапы с подсказками.<br>3. Проверки и независимое ревью.</p><h4>Граница результата</h4><p>Приёмка и сохранение в Git — после просмотра результата. Технические подробности доступны отдельно.</p>'],diff:['Изменения','<p>Изменены 7 компонентов и добавлены тесты проектной изоляции.</p><div class="diff">+ Выбор проекта в боковой панели<br>+ Компактные этапы задачи<br>+ Понятная причина ожидания<br>− Постоянное полотно технического текста</div>'],checks:['Проверки','<div class="metric"><strong>Тесты интерфейса</strong><span>51 пройден</span></div><div class="metric"><strong>Проверки Python</strong><span>15 пройдено</span></div><div class="metric"><strong>TypeScript</strong><span>Без ошибок</span></div><div class="metric"><strong>Сборка</strong><span>Успешно</span></div><h4>Вам осталось проверить</h4><p>Удобство интерфейса и соответствие вашим ожиданиям. Автоматические проверки не оценивают визуальное качество.</p>'],review:['Ревью','<h4>Результат проверки</h4><p>Проекты и команды разделены, переключение не смешивает данные. Повторные действия используют сохранённые идентификаторы операций.</p><h4>Ручная оценка</h4><p>Посмотрите интерфейс на своём экране: понятны ли статусы и легко ли найти следующее действие.</p>'],history:['История задачи','<div class="event"><time>22:57</time><div><strong>Найдена ошибка в тесте</strong><span>Mock отвечал на старый маршрут. Агент получил точную причину.</span></div></div><div class="event"><time>22:58</time><div><strong>Исправление проверено</strong><span>Тесты и сборка прошли успешно.</span></div></div><div class="event"><time>22:59</time><div><strong>Ревью обнаружило конфликт критериев</strong><span>Старое условие «только план» противоречило утверждённой реализации.</span></div></div><div class="event"><time>23:03</time><div><strong>Работа возобновлена</strong><span>Сброс попыток не означает исправление причины. Требуется повторное ревью.</span></div></div>'],reason:['Почему задача остановилась','<h4>Причина</h4><p>Ревью использовало устаревший критерий «изменить только план», хотя реализация уже была утверждена.</p><h4>Что уже прошло</h4><p>Последние тесты и production-сборка успешны. Ошибка не связана с последним запуском проверок.</p><h4>Нужны ли вы?</h4><p>Нет конкретного вопроса к вам. Контроллер должен устранить конфликт контекста и повторить ревью проверенного результата.</p>']};
function action(a){if(a.startsWith('stage:')){const i=Number(a.split(':')[1]);show(stageNames[i],`<p>${i<scenes[scene].stage?'Этап завершён.':i===scenes[scene].stage?'Текущий этап задачи.':'Этот этап ещё впереди.'}</p><p>Здесь будут факты по выбранному этапу. Подсветка и подсказка работают также с клавиатуры.</p>`);return}if(documents[a]){show(...documents[a]);return}if(a==='worker'){show('Текущая работа',`<div class="metric"><strong>Проект</strong><span>${project}</span></div><div class="metric"><strong>Задача</strong><span>#${selected} · Проекты и прогресс</span></div><div class="metric"><strong>Исполнитель</strong><span>worker-01</span></div><div class="metric"><strong>Состояние</strong><span>${scene==='running'?'Обновляет компонент карточки':'Ожидает следующего действия'}</span></div><h4>Последнее действие</h4><p>${scene==='running'?'Сохранены изменения карточки задачи. Затем контроллер запустит проверки.':'Последние проверки прошли. Активной команды сейчас нет.'}</p><h4>Наблюдать в терминале</h4><input id="terminal-command" class="terminal-command" readonly aria-label="Команда наблюдения" value="tw --project /Users/twist/tmp/ai/tw-web watch TASK-${selected}"><p>Просмотр этапов и событий. Закрытие терминала не останавливает worker. Интерактивный чат пока не подключён.</p>${btn('Скопировать команду','copy-command','','code')} ${btn('Уточнить направление','reply','','chat')} ${btn('Пауза','pause','','pause')}`);return}if(a==='preview'){show('Посмотреть результат','<div class="mock-preview"><h4>Проекты</h4><p>Задачи теперь разделены по проектам</p><div class="cards"><div><strong>tw-web</strong><br>4 задачи</div><div><strong>Магазин</strong><br>2 задачи</div></div></div><p>В продукте здесь открывается живой предпросмотр текущей рабочей копии. Можно оценить результат до принятия.</p>'+btn('Принять результат','accept','primary','check'));return}if(a==='accept'){modal.close();toast('Макет: результат принят одним нажатием, без отдельной страницы.');return}if(a==='reply'){show('Оставить уточнение','<p>Что стоит изменить? Сообщение относится к выбранной задаче, а не ко всей очереди.</p><textarea aria-label="Уточнение" placeholder="Например, оставь только статус и основное действие…"></textarea>'+btn('Отправить уточнение','send','primary','arrow'));return}if(a==='queue-demo'){toast('Макет: задача добавлена в выбранную очередь. Реальная очередь не изменена.');return}if(a==='copy-command'){const input=document.getElementById('terminal-command');input.select();if(navigator.clipboard)navigator.clipboard.writeText(input.value).then(()=>toast('Команда скопирована')).catch(()=>toast('Команда выделена — скопируйте её'));else toast('Команда выделена — скопируйте её');return}if(a==='send'){modal.close();toast('Макет: уточнение сохранено. Статус доставки будет показан в задаче.');return}if(a==='pause'){toast('Макет: запрошена пауза. Фактическая остановка подтверждается контроллером.');return}if(a==='answer'){toast('Макет: ответ сохранён, агент продолжит автоматически.');return}if(a==='projects'||a==='connect'){show('Проекты',`<p>Выбор проекта сохраняет контекст его задач.</p>${btn('tw-web','project:tw-web','primary','folder')} ${btn('Магазин','project:store','','folder')}`);return}if(a.startsWith('project:')){project=a.split(':')[1];modal.close();render();return}if(a==='create'){show('Новая задача','<p>Опишите нужный результат. Проект уже выбран: '+project+'.</p><textarea aria-label="Описание задачи" placeholder="Что нужно сделать?"></textarea>'+btn('Добавить в бэклог','send','primary','plus'));return}}
let toastTimer;function toast(message){const e=document.getElementById('toast');e.textContent=message;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,4500)}
document.addEventListener('click',e=>{const actionButton=e.target.closest('[data-action]');if(actionButton){action(actionButton.dataset.action);return}const v=e.target.closest('[data-variant]');if(v){variant=v.dataset.variant;render();return}const p=e.target.closest('[data-project]');if(p){project=p.dataset.project;render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const t=e.target.closest('[data-task]');if(t){selected=t.dataset.task;if(selected!=='003'){scene=selected==='004'?'question':'backlog';document.getElementById('scene').value=scene==='backlog'?'ready':scene}render()}});
document.getElementById('scene').addEventListener('change',e=>{scene=e.target.value;render()});document.getElementById('close-modal').addEventListener('click',()=>modal.close());modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});document.addEventListener('input',e=>{if(e.target.id==='task-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('.task-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))}});render();if(query.has('measure'))requestAnimationFrame(()=>{document.documentElement.dataset.measure=JSON.stringify({width:innerWidth,height:innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,bodyHeight:document.body.scrollHeight,detailBottom:document.querySelector('.detail').getBoundingClientRect().bottom})});
</script>
</body></html>
