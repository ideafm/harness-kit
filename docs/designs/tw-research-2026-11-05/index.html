let timer;function toast(s){let e=document.getElementById('toast');e.textContent=s;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>e.hidden=true,5000)}
function action(a){if(a==='research'){show('Что стоит за вариантами',`<p>Исследование публичных материалов · 05.11.2026. Это наши концепции Tw, а не копии интерфейсов источников.</p><div class="sources"><div><a href="https://linear.app/docs/agents-in-linear" target="_blank" rel="noreferrer">Linear · Agent platform ↗</a><small>Задача остаётся центром работы, агент — видимый участник.</small></div><div><a href="https://cursor.com/docs/cloud-agent" target="_blank" rel="noreferrer">Cursor · Cloud Agents ↗</a><small>Доступ к окружению, изменениям и артефактам выполнения.</small></div><div><a href="https://docs.devin.ai/cli/cloud" target="_blank" rel="noreferrer">Devin · Using Devin ↗</a><small>Обсуждение задачи рядом с рабочими инструментами.</small></div><div><a href="https://github.blog/news-insights/product-news/agents-panel-launch-copilot-coding-agent-tasks-anywhere-on-github/" target="_blank" rel="noreferrer">GitHub · Agent sessions ↗</a><small>Отслеживание выполнения и переход к изменениям.</small></div></div><p style="margin-top:20px">Рекомендация: основа 01 «Фокус», обзор очереди из 02 и обсуждение из 03. Данные tutor-saas вымышлены; проект не запускался.</p>`);return}if(a==='discuss'){show('Обсуждение · TASK-'+selected,conversation());return}if(a==='send'){let text=(dialog.open?dialog:document.getElementById('app')).querySelector('[data-message]').value.trim();if(!text){toast('Напишите сообщение.');return}role=(dialog.open?dialog:document.getElementById('app')).querySelector('[data-role]').value;messages.push({role,text,task:selected,project});draft='';decision=true;if(dialog.open)show('Обсуждение · TASK-'+selected,conversation());render();toast('Демо: сообщение добавлено. Задача остаётся остановленной; агент не вызывается.');return}if(a==='decision'){if(!decision){show('Решение перед продолжением',`<p>Сначала обсудите и сформулируйте решение. Переписка не меняет состояние задачи.</p>${conversation()}`);return}show('Проверить решение',`<p><strong>Демонстрация действия, реальные задачи не изменятся.</strong></p><p>Для TASK-${selected}: ${esc(messages.filter(m=>m.task===selected&&m.project===project).at(-1)?.text||'Решение ещё не сформулировано')}</p><p>Разработчик получит решение, свежий контекст и новую попытку. История трёх неудач сохранится.</p>${btn('Применить и продолжить · демо','resume','primary')}`);return}if(a==='resume'){scenario='running';dialog.close();render();toast('Демо: показано продолжение. Реальный worker не запускался.');return}if(a==='paused-resume'){scenario='running';render();toast('Демо: показано продолжение после паузы.');return}if(a==='pause'){scenario='paused';render();toast('Демо: задача приостановлена по запросу пользователя.');return}if(a==='observe'){tab='events';render();return}if(a==='request'){show('Исходный запрос',`<p>Демонстрационный запрос:</p><p>Сделать повторную запись ученика на занятие с учётом отменённой записи. Сохранить историю и исключить дубликаты.</p><p>Не задано: восстанавливать отменённую запись или создавать новую.</p>`);return}if(a==='terminal'){show('Продолжить в терминале',`<p>В продукте: откройте терминал в папке <strong>${project}</strong>, вызовите tw и выберите TASK-${selected} → обсуждение → ${esc(role)}.</p><p>История и решения общие для web и терминала. Эти действия запланированы; новый синтаксис CLI пока не реализован.</p><div class="terminal">Проект: ${project}\nЗадача: TASK-${selected}\nСобеседник: ${esc(role)}\nОбсуждение: сохранённая история задачи</div>`);return}if(a==='preview'){show('Результат · демонстрация',`<p>Постоянный адрес проекта :3000 · TASK-${previewTask} · последняя проверенная версия demo-c81f.</p>${miniPreview()}<p>Это макет приложения. tutor-saas не запускался.</p><div class="flex">${btn('Показать рабочую версию','working')}${previewTask!==selected?btn('Показывать TASK-'+selected,'switch-preview'):''}${scenario==='review'&&previewTask===selected?btn('Принять версию','accept','primary'):''}</div>`);return}if(a==='switch-preview'){previewTask=selected;show('Окружение проекта',env());render();toast('Демо: переключён ручной просмотр. Выбор наблюдаемой задачи сам его не переключает.');return}if(a==='working'){toast('Демо: рабочая версия может содержать непроверенные изменения. Адрес проекта сохраняется.');return}if(a==='accept'){show('Принять проверенную версию',`<p>Демо: TASK-${selected}, версия demo-c81f. В продукте принятие оформляет результат и ставит его в последовательную очередь интеграции.</p><p>Изменившаяся версия потребует новых проверок и приёмки. Реальные действия в этом макете отсутствуют.</p>${btn('Принять · только демо','accepted','primary')}`);return}if(a==='accepted'){dialog.close();toast('Демо: принято → очередь интеграции. Реальных коммитов и слияний нет.');return}if(a==='revise'){show('Доработка результата',`<p>Опишите, что нужно изменить. Принятая версия проекта сохраняется.</p>${conversation()}`);return}if(a==='runtime'){show('Окружение проекта',env());return}if(a==='service-log'){show('Журнал приложения · демо','<div class="terminal">[14:26] frontend ready\n[14:26] api ready\n[14:26] isolated database ready\n[14:27] GET /schedule 200</div><p>Синтетические события, не вывод настоящих процессов.</p>');return}if(a==='conflict'||a==='integration'){show('Последовательная интеграция',`<p>1. Проверить актуальный baseline основной ветки.</p><p>2. Вернуть конфликт contracts/booking.ts разработчику.</p><p>3. Повторить проверки объединённого результата.</p><p>4. При существенных изменениях запросить повторную приёмку.</p><p>Временная база сохраняется до успешного применения или окончательного отклонения.</p>`);return}if(a==='waiting'){show('Причина ожидания','<p>'+esc(current().body)+'</p>');return}if(a==='quota'){show('Ожидание лимита',`<p>Демо: этап не запускается до восстановления доступного лимита. Состояние сохранено, новая проверка назначена на 16:40.</p><p>Это ожидание снимается контроллером автоматически и не требует решения человека.</p>`);return}if(a==='refresh'){toast('Демо: запрос состояния. Настоящего соединения с контроллером нет.');return}if(a==='demo-booking'){toast('Демо: запись восстановлена, история сохранена.');return}if(a==='create'||a==='connect'){show(a==='create'?'Новая задача':'Подключение проекта',`<p>Вариант интерфейса, без сохранения в Tw.</p><div class="composer"><textarea aria-label="Описание" placeholder="${a==='create'?'Опишите ожидаемый результат…':'Папка проекта, сервисы, запуск и проверки…'}"></textarea></div>${btn('Закрыть пример','close','primary')}`);return}if(a==='close'){dialog.close();return}if(a==='inbox'){scenario='blocked';selected='024';render();return}if(a.startsWith('step:')){let i=Number(a.split(':')[1]);show(['План','Разработка','Проверки','Ревью','Приёмка'][i],`<p>${i<current().stage?'Этап завершён.':i===current().stage?'Текущий этап задачи.':'Этот этап ещё впереди.'} Отображаются подтверждённые состояния, без расчётных процентов.</p>`);return}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.variant){variant=b.dataset.variant;render()}else if(b.dataset.project){project=b.dataset.project;decision=false;draft='';toast('Демо: имена проектов переключаются, набор сценариев общий.');render()}else if(b.dataset.task){selected=b.dataset.task;decision=messages.some(m=>m.task===selected&&m.project===project);draft='';scenario=selected==='023'?'running':selected==='025'?'dependency':selected==='022'?'applied':'blocked';render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.action)action(b.dataset.action)});
document.addEventListener('input',e=>{if(e.target.matches('[data-message]'))draft=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;render()}if(e.target.matches('[data-role]'))role=e.target.value});
document.getElementById('close').addEventListener('click',()=>dialog.close());
render();
</script>
</body>
